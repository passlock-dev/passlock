  effect: "^3.21.2"
  globals: "^17.6.0"
  npm-check-updates: "^22.2.1"
  publint: "^0.3.21"
  rimraf: "^6.1.3"
  sort-package-json: "^3.6.1"
  tsx: "^4.22.4"
  typescript: "^6.0.3"
  "typedoc": "^0.28.19"
