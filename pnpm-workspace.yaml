  "@types/node": "^25.8.0"
  effect: "^3.21.2"
  globals: "^17.6.0"
  npm-check-updates: "^22.2.0"
  publint: "^0.3.21"
  rimraf: "^6.1.3"
  tsx: "^4.22.0"
  typescript: "^6.0.3"
  "typedoc": "^0.28.19"
  "typedoc-plugin-markdown": "^4.11.0"
overrides:
  qs: 6.15.0
  esbuild@<=0.24.2: '>=0.25.0'
  cookie@<0.7.0: '>=0.7.0'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  postcss@<8.5.10: '>=8.5.10'
linkWorkspacePackages: true
