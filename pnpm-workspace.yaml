packages:
  - packages/*
  - examples/*

catalog:
  "@biomejs/biome": ^2.6.4
  "@effect/vitest": ^4.1.2
  "@types/node": ^26.6.6
  effect: ^4.1.2
  globals: ^17.12.0
  npm-check-updates: ^23.1.1
  publint: ^0.3.24
  rimraf: ^6.1.3
  sort-package-json: ^4.1.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.0
  vitest: ^5.0.1

overrides:
  cookie@<0.7.0: ^0.7.0
  ts-deepmerge@<8.0.0: ^8.0.0
  typebox: 1.2.19
  vitest: "catalog:"

linkWorkspacePackages: true
preferWorkspacePackages: true
injectWorkspacePackages: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@types/node@26.0.1'
  - '@sveltejs/kit@2.68.0'
