packages:
  - packages/*
  - examples/*

catalog:
  "@biomejs/biome": ^2.5.0
  "@types/node": ^25.9.3
  effect: ^3.21.3
  globals: ^17.6.0
  npm-check-updates: ^22.2.3
  publint: ^0.3.21
  rimraf: ^6.1.3
  sort-package-json: ^4.0.0
  tsx: ^4.22.4
  typescript: ^6.0.3
  typedoc: ^0.28.19
  typedoc-plugin-markdown: ^4.12.0
  vitest: ^4.1.8

overrides:
  cookie@<0.7.0: ^0.7.0
  esbuild@<=0.24.2: ^0.24.3
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  vitest: "catalog:"

linkWorkspacePackages: true
preferWorkspacePackages: true
injectWorkspacePackages: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - joi@17.13.4
  - esbuild@0.28.1
  - esbuild@0.24.3
  - cookie@0.7.0
